name: Import occupations

# Loads O*NET and English ESCO into staging's shared occupations table (Screen 4).
# Reference data only. Run by hand; safe to re-run (rows are updated in place).
on:
  workflow_dispatch:
    inputs:
      esco:
        description: Also import ESCO (slower, about 3,000 API calls)
        type: boolean
        default: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download O*NET
        run: |
          # The release number changes, so find the newest text-format zip on O*NET's pages.
          zip=""
          for page in database.html database/download.html dictionary.html; do
            links=$(curl -fsSL "https://www.onetcenter.org/$page" | grep -oiE 'href="[^"]*\.zip"' | sed -E 's/^href="//I; s/"$//' || true)
            echo "Zip links on $page:"; echo "$links" | head -20
            zip=$(echo "$links" | grep -iE 'text\.zip$' | sort -V | tail -1)
            [ -n "$zip" ] && break
          done
          if [ -z "$zip" ]; then echo "::error::Could not find the O*NET text download link."; exit 1; fi
          case "$zip" in http*) url="$zip" ;; /*) url="https://www.onetcenter.org$zip" ;; *) url="https://www.onetcenter.org/$zip" ;; esac
          echo "Using $url"
          curl -fsSL "$url" -o onet.zip
          mkdir onet && unzip -q -j onet.zip -d onet
      - name: Import
        env:
          DATABASE_URL: ${{ secrets.STAGING_DB_URL }}
          ONET_DIR: ${{ github.workspace }}/onet
          IMPORT_ESCO: ${{ inputs.esco }}
        run: pnpm --filter @interview-prep/db import-occupations
