name: Import occupations

# Loads O*NET and English ESCO into staging's shared occupations table (Screen 4).
# Reference data only. Run by hand; safe to re-run (rows are updated in place).
on:
  workflow_dispatch:
    inputs:
      esco:
        description: Also import ESCO (slower, about 3,000 API calls)
        type: boolean
        default: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download O*NET
        run: |
          # The release number changes: read it from the newest download on the database page,
          # then fetch the tab-separated text edition of that release.
          release=$(curl -fsSL https://www.onetcenter.org/database.html | grep -oE 'db_[0-9]+_[0-9]+_[a-z]+\.zip' | sed -E 's/_[a-z]+\.zip$//' | sort -uV | tail -1)
          if [ -z "$release" ]; then echo "::error::Could not find the current O*NET release."; exit 1; fi
          echo "Using $release"
          curl -fsSL "https://www.onetcenter.org/dl_files/database/${release}_text.zip" -o onet.zip
          mkdir onet && unzip -q -j onet.zip -d onet && ls onet | head -50
      - name: Import
        env:
          DATABASE_URL: ${{ secrets.STAGING_DB_URL }}
          ONET_DIR: ${{ github.workspace }}/onet
          IMPORT_ESCO: ${{ inputs.esco }}
        run: pnpm --filter @interview-prep/db import-occupations
